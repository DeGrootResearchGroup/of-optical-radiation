name: CI

on:
  pull_request:
    branches: [main]

# Cancel an in-flight run when a new commit is pushed to the same PR
# (or branch). Each PR has its own concurrency group so unrelated PRs
# don't block one another.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # If a PR touches the Dockerfile, build the image fresh on that
  # PR's commit and use it for testing. Otherwise the image is the
  # published ghcr.io tag (built by docker-publish.yml on main pushes).
  # Without this split, a Dockerfile change couldn't actually test its
  # own image until after merge -- the published tag was always the
  # previous version.
  detect-docker-change:
    runs-on: ubuntu-latest
    outputs:
      docker_changed: ${{ steps.check.outputs.docker_changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: check
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          if git diff --name-only "$base" "$head" \
              | grep -E '^(Dockerfile|\.github/workflows/docker-publish\.yml)$' \
              > /dev/null
          then
              echo "docker_changed=true" >> "$GITHUB_OUTPUT"
          else
              echo "docker_changed=false" >> "$GITHUB_OUTPUT"
          fi

  build-pr-image:
    needs: detect-docker-change
    if: needs.detect-docker-change.outputs.docker_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build PR image, export as artifact
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          tags: photobio-ci:pr
          outputs: type=docker,dest=/tmp/photobio-ci.tar
          cache-from: type=gha
      - uses: actions/upload-artifact@v4
        with:
          name: docker-image-pr
          path: /tmp/photobio-ci.tar
          retention-days: 1

  test:
    needs: [detect-docker-change, build-pr-image]
    if: |
      always()
      && (needs.build-pr-image.result == 'success'
          || needs.build-pr-image.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Either pull the published image (regular PR) or load the
      # PR-built one (Dockerfile-touching PR). Tag both as
      # photobio-ci:current so the rest of the steps don't have to
      # branch.
      - name: Pull published CI image
        if: needs.detect-docker-change.outputs.docker_changed == 'false'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
              | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker pull \
              ghcr.io/degrootresearchgroup/of-optical-radiation-ci:latest
          docker tag \
              ghcr.io/degrootresearchgroup/of-optical-radiation-ci:latest \
              photobio-ci:current

      - name: Download PR-built CI image
        if: needs.detect-docker-change.outputs.docker_changed == 'true'
        uses: actions/download-artifact@v4
        with:
          name: docker-image-pr
          path: /tmp/

      - name: Import PR-built CI image
        if: needs.detect-docker-change.outputs.docker_changed == 'true'
        run: |
          docker load -i /tmp/photobio-ci.tar
          docker tag photobio-ci:pr photobio-ci:current

      - name: Build library + run regression tests
        run: |
          docker run --rm \
              -e USER=root \
              -v "$(pwd):/code" \
              -w /code \
              photobio-ci:current \
              bash -c '
                  # Source bashrc BEFORE turning on set -e. OpenFOAMs
                  # etc/bashrc has an if/else block whose else branch
                  # ends in "unalias wmRefresh 2> /dev/null". When
                  # wmRefresh is not an alias (the typical fresh-shell
                  # case), unalias returns non-zero, and bash returns
                  # that through the if statement. Under set -e that
                  # is fatal and the shell aborts immediately, before
                  # Allwmake even starts, with no error output. After
                  # the source completes, our own commands run with
                  # the usual fail-fast guarantee.
                  source /opt/openfoam13/etc/bashrc
                  set -e
                  # Install the in-tree uvmesh helper. The Docker image
                  # ships its dependencies (python3-gmsh, numpy,
                  # blockmeshbuilder, pytest) but the helper itself is
                  # bind-mounted from the checkout, so the install must
                  # run inside the test container.
                  pip3 install --quiet /code/tools/uvMesh
                  # Run the uvmesh Python unit tests first -- they are
                  # pure-Python and fast (<1 s for the full suite). A
                  # failure here means the helper itself is broken and
                  # there is no point running the OpenFOAM regression
                  # cases (which would either fail with the same root
                  # cause or, worse, produce subtly wrong meshes).
                  ( cd /code/tools/uvMesh && python3 -m pytest tests/ )
                  ./Allwmake
                  cd tests && ./Alltest
              '

  # Docs build. Independent of the OpenFOAM toolchain -- Sphinx +
  # MyST + sphinxcontrib-bibtex only -- so no Docker, just a Python
  # runtime matching the one Read the Docs uses. -W promotes warnings
  # to errors; --keep-going collects all warnings instead of stopping
  # at the first, so a PR sees the full list in one shot.
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: docs/requirements.txt
      - name: Install Sphinx + extensions
        run: pip install -r docs/requirements.txt
      - name: Build docs (warnings as errors)
        run: sphinx-build -W --keep-going -b html docs docs/_build/html
