[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "uvmesh"
version = "0.1.0"
description = "Hybrid O-grid-annulus + polyhedral-bulk mesh generator for UV reactor cases"
requires-python = ">=3.8"
dependencies = [
    "numpy",
    # blockmeshbuilder pinned from upstream; pip can't satisfy by name alone.
    # Install separately: pip install git+https://github.com/NauticalMile64/blockmeshbuilder.git
    #
    # gmsh Python bindings come from the system gmsh package (apt: python3-gmsh).
    # The PyPI `gmsh` wheel exists for x86_64 only -- on arm64 the apt route is
    # the only option. Hence neither is listed here as a hard dependency.
]

[tool.setuptools.packages.find]
where = ["."]
include = ["uvmesh*"]
